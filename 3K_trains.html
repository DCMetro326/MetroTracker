<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Trains</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
            color: #000000;
        }

        h1 {
            text-align: center;
            margin: 10px 0 30px;
            font-size: 32px;
        }

        h2 {
            font-size: 26px;
            margin: 0 0 20px;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        .car-card {
            border: 1px solid #000000;
            color: #000000;
            background: #ffffff;
            padding: 10px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        /* Retired card styling */
        .car-card.retired {
            border-color: darkred;
            color: darkred;
        }

        .car-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border: none;
            border-radius: 0;
        }

        .car-number {
            font-size: 32px;
            font-weight: bold;
            line-height: 1.2;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        /* Fixed space keeps all cards the same height. */
        .car-info {
            font-size: 16px;
            line-height: 20px;
            min-height: 20px;
            overflow-wrap: anywhere;
        }

        .retired-section {
            border-top: 2px solid #000000;
            margin-top: 40px;
            padding-top: 24px;
        }

        .retired-section[hidden] {
            display: none;
        }

        @media (max-width: 900px) {
            .car-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .car-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .car-number {
                font-size: 27px;
            }

            h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 360px) {
            .car-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script src="3K_trains.js" defer></script>
</head>

<body>
    <h1>System Trains</h1>

    <main>
        <div id="activeCars" class="car-grid"></div>

        <section id="retiredSection"
                 class="retired-section"
                 hidden>
            <h2>Retired Cars</h2>
            <div id="retiredCars" class="car-grid"></div>
        </section>
    </main>
</body>
</html>
