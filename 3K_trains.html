<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Trains</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #ffffff;
            color: #000000;
        }
        
        h1 {
            text-align: center;
            margin: 8px 0 24px;
            font-size: 28px;
        }
        
        h2 {
            font-size: 22px;
            margin: 0 0 16px;
        }
        
        /* Ten compact cars per row */
        .car-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
        }
        
        /* Compact cards with thicker borders */
        .car-card {
            border: 2px solid #000000;
            color: #000000;
            background: #ffffff;
            padding: 5px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        
        /* Retired cars */
        .car-card.retired {
            border-color: darkred;
            color: darkred;
        }
        
        /* Small 4:3 image, no border or rounded corners */
        .car-image {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border: none;
            border-radius: 0;
        }
        
        /* Smaller car number */
        .car-number {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
            margin-top: 6px;
            margin-bottom: 3px;
        }
        
        /* Reserved information space */
        .car-info {
            font-size: 11px;
            line-height: 14px;
            min-height: 14px;
            overflow-wrap: anywhere;
        }
        
        /* Retired Cars section */
        .retired-section {
            border-top: 2px solid #000000;
            margin-top: 28px;
            padding-top: 18px;
        }
        
        .retired-section[hidden] {
            display: none;
        }
        
        /* Responsive layout for smaller screens */
        @media (max-width: 1100px) {
            .car-grid {
                grid-template-columns: repeat(8, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 850px) {
            .car-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
        
            .car-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
            }
        
            .car-number {
                font-size: 17px;
            }
        
            .car-info {
                font-size: 10px;
                line-height: 12px;
                min-height: 12px;
            }
        
            h1 {
                font-size: 24px;
            }
        }
        
        @media (max-width: 400px) {
            .car-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
    </style>

    <script src="3K_trains.js" defer></script>
</head>

<body>
    <h1>System Trains</h1>

    <main>
        <div id="activeCars" class="car-grid"></div>

        <section id="retiredSection"
                 class="retired-section"
                 hidden>
            <h2>Retired Cars</h2>
            <div id="retiredCars" class="car-grid"></div>
        </section>
    </main>
</body>
</html>
